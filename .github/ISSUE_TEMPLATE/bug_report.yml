name: Bug Report
description: Create a report to help us improve Seccure
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is the bug? What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps To Reproduce
      description: How can we reproduce the problem?
      placeholder: |
        1. Run Seccure on repo X
        2. Wait for PR creation
        3. See error Y
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Paste any relevant logs or output here.
      render: shell
  - type: input
    id: version
    attributes:
      label: Seccure Version / Docker Tag
      description: What version of the Seccure Docker image are you running?
      placeholder: "e.g. latest, v1.0.0"
    validations:
      required: true
