updates:
- directory: /
  labels:
  - dependabot
  - security
  - python
  package-ecosystem: pip
  schedule:
    interval: weekly
- directory: /
  labels:
  - dependabot
  - security
  - docker
  package-ecosystem: docker
  schedule:
    interval: weekly
- directory: /
  ignore:
  - dependency-name: "github/gh-aw-actions" # Managed by gh aw compile. Version-locked to the gh-aw compiler; do not bump.
  labels:
  - dependabot
  - security
  - github-actions
  package-ecosystem: github-actions
  schedule:
    interval: weekly
version: 2
