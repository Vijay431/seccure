name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          
      - name: Install dependencies
        run: |
          uv pip install --system ruff mypy
          uv pip install --system -r requirements.txt
          
      - name: Lint with Ruff
        run: |
          # Run the ruff linter and formatter check
          ruff check .
          ruff format --check .
          
      - name: Type check with mypy
        run: |
          mypy agent/
