[project]
name = "seccure"
version = "1.0.0"
description = "Seccure is an automated multi-agent GitHub Dependabot auto-fix AI agent. It uses LangChain via OpenRouter to autonomously fix security vulnerabilities, resolve npm audit alerts, and generate consolidated pull requests."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Seccure Contributors" },
]
keywords = [
    "security",
    "dependabot",
    "auto-fix",
    "ai",
    "agent",
    "langchain",
    "vulnerability",
    "npm",
    "cve"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "langchain>=1.3.11",
    "langchain-mcp-adapters>=0.3.0",
    "langsmith==0.8.18",
    "mcp>=1.28.0",
    "openai>=2.43.0",
    "pydantic==2.13.4",
    "pytest-asyncio>=1.4.0",
    "tenacity>=8.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
explicit_package_bases = true
ignore_missing_imports = true
